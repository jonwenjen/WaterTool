# 把網站（純靜態檔，不需建置）發佈到 GitHub Pages。
# 第一次使用：Settings → Pages → Build and deployment → Source 選「GitHub Actions」。
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 只放網站需要的檔案
        run: |
          mkdir _site
          cp -r index.html app.js player-gl.js worker.js style.css sw.js manifest.webmanifest icons lib models vendor _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
