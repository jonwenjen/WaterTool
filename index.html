<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WaterTool 水下影片還原</title>
  <meta name="description" content="七種論文方法（Ancuti 融合、MLLE、ULAP、UDCP、RGHS、Sea-thru、FUnIE-GAN）還原水下影片與照片，含影片時間一致性，全部在瀏覽器內執行。">
  <meta name="theme-color" content="#0b2a3a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <div>
        <h1>WaterTool</h1>
        <p>水下影片還原 · 7 種論文方法 · 檔案不離開裝置</p>
      </div>
    </div>
    <div class="actions">
      <label class="btn primary" for="file">開啟影片／照片</label>
      <input id="file" type="file" accept="video/*,image/*" hidden>
      <button class="btn" id="demo" type="button">合成示範</button>
      <button class="btn" id="install" type="button" hidden>安裝 App</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage">
      <div class="viewer" id="viewer">
        <canvas id="view" width="960" height="540" aria-label="預覽"></canvas>
        <div class="split-handle" id="handle" role="slider" aria-label="分割線位置" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></div>
        <span class="tag left" id="tagL">原始</span>
        <span class="tag right" id="tagR">還原</span>
        <div class="empty" id="empty">
          <p class="big">把水下影片或照片拖到這裡</p>
          <p>或按「開啟影片／照片」；沒有素材可按「合成示範」。</p>
          <p class="muted">支援 MP4 / MOV / WebM 與 JPG / PNG。所有運算在本機瀏覽器完成。</p>
        </div>
        <div class="busy" id="busy" hidden></div>
      </div>

      <div class="transport">
        <button class="icon" id="play" type="button" aria-label="播放" disabled>▶</button>
        <input type="range" id="seek" min="0" max="1000" value="0" disabled aria-label="時間軸">
        <span class="time" id="time">0:00 / 0:00</span>
        <div class="seg" role="tablist" aria-label="檢視方式">
          <button type="button" data-view="split" class="on">分割</button>
          <button type="button" data-view="result">結果</button>
          <button type="button" data-view="original">原始</button>
          <button type="button" data-view="compare">七法比較</button>
        </div>
      </div>

      <div class="stats" id="stats">
        <span id="stMethod">—</span>
        <span id="stTime"></span>
        <span id="stQuality"></span>
        <button class="link" id="measure" type="button">計算品質指標</button>
      </div>

      <div class="compare" id="compare" hidden></div>
    </section>

    <aside class="panel">
      <section class="card">
        <h2>還原方法</h2>
        <div class="methods" id="methods" role="radiogroup" aria-label="還原方法"></div>
      </section>

      <section class="card">
        <h2>參數 <button class="link" id="resetParams" type="button">重設</button></h2>
        <div id="params" class="controls"></div>
        <div id="modelState" class="note" hidden></div>
      </section>

      <section class="card">
        <h2>影片時間一致性</h2>
        <div class="controls">
          <label class="switch"><input type="checkbox" id="tOn" checked> <span>啟用（避免閃爍）</span></label>
          <div class="ctl"><label for="tTau">參數平滑時間 τ <output id="tTauV"></output></label><input type="range" id="tTau" min="0" max="3" step="0.05" value="0.6"></div>
          <div class="ctl"><label for="tDef">輸出去閃爍 <output id="tDefV"></output></label><input type="range" id="tDef" min="0" max="1" step="0.05" value="0.6"></div>
          <div class="ctl"><label for="tEvery">每 N 幀重新估計 <output id="tEveryV"></output></label><input type="range" id="tEvery" min="1" max="10" step="1" value="1"></div>
        </div>
        <p class="note">逐幀還原會因每幀估計值不同而閃爍。這裡把全域參數做時間平滑（換鏡頭自動重設），並把靜止區域的低頻亮度/色彩對齊前一幀。</p>
      </section>

      <section class="card">
        <h2>輸出</h2>
        <div class="controls">
          <div class="ctl"><label for="mix">還原強度 <output id="mixV"></output></label><input type="range" id="mix" min="0" max="1" step="0.05" value="1"></div>
          <div class="ctl"><label for="post">自動色階（後處理） <output id="postV"></output></label><input type="range" id="post" min="0" max="1" step="0.05" value="0"></div>
          <div class="ctl"><label for="prevRes">預覽解析度</label>
            <select id="prevRes"><option value="480">480p（快）</option><option value="720" selected>720p</option><option value="1080">1080p</option></select></div>
          <p class="note">播放時預覽以 480p 計算；暫停、照片與匯出使用完整設定。</p>
          <div class="ctl"><label for="outRes">匯出解析度</label>
            <select id="outRes"><option value="0">原始</option><option value="2160">4K（長邊 3840）</option><option value="1080" selected>1080p</option><option value="720">720p</option></select></div>
        </div>
        <div class="row">
          <button class="btn primary" id="export" type="button" disabled>匯出</button>
          <button class="btn" id="cancel" type="button" hidden>取消</button>
        </div>
        <progress id="prog" max="1" value="0" hidden></progress>
        <p class="note" id="exportNote"></p>
      </section>

      <section class="card about">
        <h2>方法與出處</h2>
        <div id="about"></div>
        <p class="note">完整研究整理、評測數據與實作差異見專案 README。</p>
      </section>
    </aside>
  </main>

  <video id="video" playsinline muted hidden></video>
  <script type="module" src="app.js"></script>
</body>
</html>
